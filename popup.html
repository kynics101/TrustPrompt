<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustPrompt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #fff;
    }
    .subtitle {
      color: #888;
      font-size: 11px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: #388E3C; }
    .dot.red    { background: #D32F2F; }
    .dot.orange { background: #F57C00; }
    .dot.yellow { background: #F9A825; }

    button {
      width: 100%;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 7px 0;
      font-size: 12px;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #3a3a3a; }
    .legend { margin-top: 14px; }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0;
      font-size: 12px;
      color: #bbb;
    }
    a { color: #69b4ff; font-size: 11px; }
  </style>
</head>
<body>
  <h1>🛡 TrustPrompt</h1>
  <div class="subtitle">Prompt privacy shield — v0.0.2</div>

  <div class="status-row">
    <div class="dot green" id="status-dot"></div>
    <span id="status-text">No sensitive data detected</span>
  </div>

  <button id="btn-refresh">↻ Refresh Rules</button>

  <div class="legend">
    <div class="legend-row"><div class="dot red"></div>   High risk — financial / auth data</div>
    <div class="legend-row"><div class="dot orange"></div> Medium risk — contact / location</div>
    <div class="legend-row"><div class="dot yellow"></div> Low risk — metadata / labels</div>
    <div class="legend-row"><div class="dot green"></div>  Safe — no sensitive data found</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

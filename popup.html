<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPrompt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand">
      <img class="logo" src="icons/icon-32.png" width="28" height="28" alt="" aria-hidden="true">
      <span class="brand-name">TrustPrompt</span>
    </div>
    <div class="header-actions">
      <button id="btn-settings" class="icon-btn" type="button" title="Manage extension" aria-label="Manage extension">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.4 7.4 0 0 0-1.7-1L14.4 3a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.8 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.2 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
      <button id="btn-help" class="icon-btn" type="button" title="Consent steps" aria-label="Consent steps">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 16h-2v-2h2v2Zm1.1-6.4-.9.9A2.8 2.8 0 0 0 12.5 14h-1v-.5c0-1.1.5-2.1 1.3-2.8l1.2-1.2c.4-.3.6-.8.6-1.3a2 2 0 0 0-4 0H9a3 3 0 1 1 6 0c0 .8-.3 1.5-.9 2.1Z"/></svg>
      </button>
    </div>
  </header>

  <section class="status" aria-live="polite">
    <div class="status-line">
      <span id="status-dot" class="dot off" aria-hidden="true"></span>
      <span id="status-text">Off</span>
    </div>
    <p id="status-detail" class="status-detail"></p>
  </section>

  <ul id="menu" class="menu"></ul>

  <footer class="popup-footer">
    <button id="btn-steps" type="button" class="footer-btn">Review terms</button>
  </footer>

  <script src="consent-state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
